<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialApp</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; display: flex; }
        
        /* Modal Autenticación */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .auth-card { background: #1e293b; padding: 2.5rem; border-radius: 1rem; width: 100%; max-width: 400px; border: 1px solid #334155; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
        
        /* Pestañas tipo Pastilla */
        .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: #0f172a; padding: 0.35rem; border-radius: 0.6rem; border: 1px solid #334155; }
        .auth-tab-btn { flex: 1; padding: 0.75rem 0.5rem; background: transparent; border: none; color: #94a3b8; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s ease; border-radius: 0.4rem; text-align: center; }
        .auth-tab-btn.active { background: #6366f1; color: #ffffff !important; box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.4); }
        .auth-tab-btn:hover:not(.active) { color: #f8fafc; }

        .auth-card input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; outline: none; }
        .auth-card button[type="submit"] { width: 100%; padding: 0.8rem; background: #6366f1; border: none; border-radius: 0.5rem; color: #fff; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .auth-card button[type="submit"]:hover { background: #4f46e5; }

        /* Layout Principal */
        #app-layout { display: none; width: 100vw; height: 100vh; }
        .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .search-box { padding: 0.75rem; }
        .search-box input { width: 100%; padding: 0.6rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; outline: none; }
        
        .conversations-list { flex: 1; overflow-y: auto; }
        .chat-card { display: flex; align-items: center; padding: 0.8rem 1rem; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.2s; }
        .chat-card:hover, .chat-card.active { background: #334155; }
        .chat-card img { width: 45px; height: 45px; border-radius: 50%; margin-right: 0.8rem; object-fit: cover; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem; }
        .chat-title h4 { font-size: 0.95rem; color: #f8fafc; }
        .last-message { font-size: 0.8rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Main Content */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #0f172a; position: relative; }
        .chat-header { padding: 1rem; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; margin-right: 0.8rem; }
        
        .messages-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
        .date-divider { text-align: center; margin: 1rem 0; font-size: 0.8rem; color: #64748b; }
        
        .message-wrapper { display: flex; flex-direction: column; max-width: 65%; }
        .message-wrapper.outgoing { align-self: flex-end; }
        .message-wrapper.incoming { align-self: flex-start; }
        
        .message-bubble { padding: 0.75rem 1rem; border-radius: 1rem; background: #1e293b; color: #f8fafc; position: relative; word-break: break-word; }
        .message-wrapper.outgoing .message-bubble { background: #6366f1; }
        .message-bubble.deleted { opacity: 0.6; font-style: italic; }
        
        .msg-meta { font-size: 0.65rem; color: #a5b4fc; margin-top: 0.3rem; text-align: right; }
        
        .message-actions-menu { display: none; position: absolute; top: -10px; right: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 2px; }
        .message-bubble:hover .message-actions-menu { display: flex; }
        .action-btn { background: none; border: none; color: #94a3b8; padding: 2px 5px; cursor: pointer; font-size: 0.9rem; }
        .action-btn:hover { color: #fff; }

        /* Input Area */
        .chat-input-area { padding: 1rem; background: #1e293b; border-top: 1px solid #334155; }
        .chat-form { display: flex; align-items: center; gap: 0.5rem; }
        .chat-form input[type="text"] { flex: 1; padding: 0.8rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; color: #fff; outline: none; }
        .icon-btn { background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; padding: 0.4rem; border-radius: 0.5rem; }
        .icon-btn:hover { color: #6366f1; background: #0f172a; }

        /* Secciones SPA */
        .tab-content { display: none; flex: 1; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .tab-content.active { display: flex; }

        /* Publicaciones / Tarjetas */
        .post-card { background: #1e293b; border: 1px solid #334155; border-radius: 0.8rem; padding: 1rem; margin-bottom: 1rem; }
        .post-header { display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.8rem; }
        .post-header img { width: 40px; height: 40px; border-radius: 50%; }

        /* Configuración / Perfil */
        .settings-section { background: #1e293b; border: 1px solid #334155; border-radius: 0.8rem; padding: 1.2rem; margin-bottom: 1.5rem; }
        .settings-section h3 { margin-bottom: 1rem; color: #818cf8; font-size: 1.1rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #94a3b8; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.6rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.4rem; color: #fff; outline: none; }

        /* Reply Bar */
        #reply-preview-bar { display: none; background: #0f172a; padding: 0.5rem 1rem; border-left: 3px solid #6366f1; margin-bottom: 0.5rem; justify-content: space-between; align-items: center; }

        /* Loader Overlay */
        #loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: #fff; justify-content: center; align-items: center; flex-direction: column; z-index: 2000; }
    </style>
</head>
<body>

    <!-- Overlay Carga -->
    <div id="loading-overlay">
        <h3 id="loading-text">Cargando...</h3>
    </div>

    <!-- Modal Autenticación -->
    <div id="auth-modal" class="modal-overlay">
        <div class="auth-card">
            <div class="auth-tabs">
                <button id="btn-show-login" class="auth-tab-btn active">Iniciar Sesión</button>
                <button id="btn-show-register" class="auth-tab-btn">Registrarse</button>
            </div>
            
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Usuario o Correo" required>
                <input type="password" id="login-password" placeholder="Contraseña" required>
                <button type="submit">Entrar</button>
            </form>

            <form id="register-form" style="display: none;">
                <input type="text" id="reg-username" placeholder="Nombre de usuario" required>
                <input type="email" id="reg-email" placeholder="Correo electrónico" required>
                <input type="password" id="reg-password" placeholder="Contraseña" required>
                <button type="submit">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <!-- Layout Principal -->
    <div id="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <img id="my-avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=default" alt="Avatar">
                <div style="display: flex; gap: 0.3rem;">
                    <button class="icon-btn nav-tab active" data-tab="tab-chat" title="Chats"><i class="ph ph-chat-circle-dots"></i></button>
                    <button class="icon-btn nav-tab" data-tab="tab-stories" title="Estados"><i class="ph ph-aperture"></i></button>
                    <button class="icon-btn nav-tab" data-tab="tab-posts" title="Publicaciones"><i class="ph ph-newspaper"></i></button>
                    <button class="icon-btn nav-tab" data-tab="tab-settings" title="Configuración"><i class="ph ph-gear"></i></button>
                    <button class="icon-btn" id="open-add-modal-btn" title="Agregar Contacto"><i class="ph ph-user-plus"></i></button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-chats-input" placeholder="Buscar conversaciones...">
            </div>
            <div class="conversations-list" id="conversations-list">
                <!-- Chat Global -->
                <div class="chat-card active" data-chat-id="global-chat" data-chat-name="Comunidad Global 🌐" data-chat-avatar="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=150&auto=format&fit=crop">
                    <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=150&auto=format&fit=crop" alt="Global">
                    <div class="chat-info">
                        <div class="chat-title">
                            <h4>Comunidad Global 🌐</h4>
                            <span class="time">Público</span>
                        </div>
                        <p class="last-message">¡Conoce gente de todo el mundo!</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Principal -->
        <div class="main-chat">
            
            <!-- Pestaña de Chat Activo -->
            <div id="tab-chat" class="tab-content active" style="padding:0; flex-direction:column; height:100%;">
                <div class="chat-header">
                    <img id="active-chat-avatar" src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=150&auto=format&fit=crop">
                    <div>
                        <h3 id="active-chat-title">Comunidad Global 🌐</h3>
                        <span id="active-chat-status" style="font-size:0.75rem; color:#10b981;">En línea</span>
                    </div>
                </div>

                <div class="messages-container" id="messages-container">
                    <div class="date-divider"><span>¡Bienvenido al chat!</span></div>
                </div>

                <!-- Responder Mensajes -->
                <div id="reply-preview-bar">
                    <div>
                        <span id="reply-to-name" style="font-size:0.8rem; font-weight:bold; color:#6366f1;"></span>
                        <p id="reply-to-text" style="font-size:0.75rem; color:#94a3b8;"></p>
                    </div>
                    <button class="icon-btn" id="close-reply-btn"><i class="ph ph-x"></i></button>
                </div>

                <!-- Formulario de Entrada -->
                <div class="chat-input-area">
                    <form id="chat-form" class="chat-form">
                        <input type="text" id="message-input" placeholder="Escribe un mensaje..." autocomplete="off">
                        <button type="submit" class="icon-btn" id="send-btn"><i class="ph ph-paper-plane-right"></i></button>
                    </form>
                </div>
            </div>

            <!-- Pestaña Estados -->
            <div id="tab-stories" class="tab-content">
                <h2 style="margin-bottom:1rem;">Estados</h2>
                <form id="story-form" style="margin-bottom:1.5rem; display:flex; gap:0.5rem;">
                    <input type="text" id="story-text-input" placeholder="¿Qué estás pensando?" style="flex:1; padding:0.6rem; background:#1e293b; border:1px solid #334155; color:#fff; border-radius:0.4rem; outline:none;" required>
                    <button type="submit" style="padding:0.6rem 1.2rem; background:#6366f1; border:none; color:#fff; border-radius:0.4rem; cursor:pointer; font-weight:bold;">Publicar Estado</button>
                </form>
                <div id="stories-feed-list"></div>
            </div>

            <!-- Pestaña Publicaciones -->
            <div id="tab-posts" class="tab-content">
                <h2 style="margin-bottom: 1rem;">Publicaciones de la Comunidad</h2>
                
                <div class="settings-section">
                    <h3>Crear una Publicación</h3>
                    <form id="post-form">
                        <div class="form-group">
                            <input type="text" id="post-title-input" placeholder="Título de la publicación..." required>
                        </div>
                        <div class="form-group">
                            <textarea id="post-content-input" rows="3" placeholder="¿Qué quieres compartir hoy con la comunidad?" required></textarea>
                        </div>
                        <button type="submit" style="padding:0.6rem 1.2rem; background:#6366f1; border:none; color:#fff; border-radius:0.4rem; cursor:pointer; font-weight:bold;">Publicar</button>
                    </form>
                </div>

                <div id="posts-feed-list"></div>
            </div>

            <!-- Pestaña Configuración -->
            <div id="tab-settings" class="tab-content">
                <h2 style="margin-bottom:1.5rem;">Configuración de la Cuenta</h2>

                <div class="settings-section">
                    <h3><i class="ph ph-user-circle"></i> Editar Perfil</h3>
                    <form id="edit-profile-form">
                        <div style="display:flex; align-items:center; gap:1.2rem; margin-bottom:1.2rem;">
                            <img id="profile-edit-avatar-preview" src="" style="width:70px; height:70px; border-radius:50%; object-fit:cover;">
                            <div>
                                <h4 id="profile-edit-name-display" style="font-size:1.1rem; color:#fff;"></h4>
                                <p id="profile-edit-desc-display" style="color:#94a3b8; font-size:0.85rem; margin-top:0.2rem;"></p>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>URL de Imagen de Avatar:</label>
                            <input type="text" id="edit-profile-avatar-url" placeholder="https://...">
                        </div>

                        <div class="form-group">
                            <label>Descripción Personal:</label>
                            <input type="text" id="edit-profile-desc-input" placeholder="Cuéntale un poco sobre ti a los demás...">
                        </div>

                        <button type="submit" style="padding:0.6rem 1.2rem; background:#6366f1; border:none; color:#fff; border-radius:0.4rem; cursor:pointer; font-weight:bold;">Guardar Cambios de Perfil</button>
                    </form>
                </div>

                <div class="settings-section">
                    <h3><i class="ph ph-shield-check"></i> Cuenta y Sesión</h3>
                    <div class="form-group">
                        <label>Correo Electrónico Registrado:</label>
                        <input type="text" id="profile-edit-email-display" readonly style="opacity:0.7; cursor:not-allowed;">
                    </div>
                    <button type="button" id="logout-btn-profile" style="padding:0.6rem 1.2rem; background:#ef4444; border:none; color:#fff; border-radius:0.4rem; cursor:pointer; font-weight:bold;">Cerrar Sesión</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Agregar Amigo -->
    <div id="add-friend-modal" class="modal-overlay" style="display:none;">
        <div class="auth-card">
            <h3>Agregar Contacto</h3>
            <form id="add-friend-form" style="margin-top:1rem;">
                <input type="text" id="add-friend-input" placeholder="Nombre de usuario del contacto" required>
                <div style="display:flex; gap:0.5rem;">
                    <button type="submit" style="flex:1;">Agregar</button>
                    <button type="button" id="close-add-modal-btn" style="flex:1; background:#334155;">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Ver Estado -->
    <div id="story-viewer-modal" class="modal-overlay" style="display:none;">
        <div class="auth-card" style="text-align:center;">
            <img id="story-view-avatar" src="" style="width:60px; height:60px; border-radius:50%; margin-bottom:0.5rem;">
            <h3 id="story-view-author"></h3>
            <span id="story-view-time" style="font-size:0.75rem; color:#94a3b8;"></span>
            <p id="story-view-text" style="margin:1.5rem 0; font-size:1.1rem; color:#f8fafc;"></p>
            <button type="button" id="close-story-modal">Cerrar</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
